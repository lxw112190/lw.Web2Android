name: M2 Unsigned APK Integration

on:
  push:
    paths:
      - 'packer/**'
      - 'runtime-dist/**'
      - 'samples/**'
      - 'toolchain.lock.json'
      - '.github/workflows/integration-ci.yml'
  pull_request:
    paths:
      - 'packer/**'
      - 'runtime-dist/**'
      - 'samples/**'
      - 'toolchain.lock.json'
      - '.github/workflows/integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-apks:
    name: Assemble local and remote unsigned APKs
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install locked Android toolchain
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          sdkmanager "platforms;android-$($lock.platformApi)" "build-tools;$($lock.buildToolsVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test Packer
        shell: pwsh
        run: |
          cmake -S packer -B build/packer -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/packer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/packer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble unsigned sample APKs
        shell: pwsh
        run: |
          $packer = Resolve-Path 'build/packer/Release/lw.Web2Android.exe'
          & $packer build samples/hello/project.json --android-sdk $env:ANDROID_SDK_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $packer build samples/remote/project.json --android-sdk $env:ANDROID_SDK_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate APK structure and alignment
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          $zipalign = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($lock.buildToolsVersion)/zipalign.exe"
          $expectations = @{
            'build/m2/hello-1.0.0-unsigned.apk' = @('classes.dex', 'assets/lw-config.json', 'assets/www/index.html')
            'build/m2/remote-1.0.0-unsigned.apk' = @('classes.dex', 'assets/lw-config.json')
          }
          foreach ($apk in $expectations.Keys) {
            & $zipalign -c -v 4 $apk
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
            try {
              $names = @($zip.Entries.FullName)
              foreach ($required in $expectations[$apk]) {
                if ($required -notin $names) { throw "$apk is missing $required" }
              }
              if ($apk -like '*remote*' -and $names.Where({ $_ -like 'assets/www/*' }).Count -ne 0) {
                throw "$apk unexpectedly contains local web assets"
              }
            } finally {
              $zip.Dispose()
            }
          }

      - name: Upload unsigned sample APKs
        uses: actions/upload-artifact@v4
        with:
          name: m2-unsigned-sample-apks
          path: build/m2/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
