name: Runtime CI

on:
  push:
    paths:
      - 'runtime/**'
      - 'samples/**'
      - 'tools/package-runtime.ps1'
      - 'toolchain.lock.json'
      - '.github/workflows/runtime-ci.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'samples/**'
      - 'tools/package-runtime.ps1'
      - 'toolchain.lock.json'
      - '.github/workflows/runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build and validate reusable Runtime DEX
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install locked Android platform
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          sdkmanager "platforms;android-$($lock.platformApi)" "build-tools;$($lock.buildToolsVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Compile, lint and shrink Runtime
        run: gradle --no-daemon --stacktrace -p runtime clean :app:lintRelease :app:assembleRelease

      - name: Package and validate Runtime bundle
        shell: pwsh
        run: ./tools/package-runtime.ps1

      - name: Upload Runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-v1
          path: build/runtime-dist/runtime-v1.zip
          if-no-files-found: error
          retention-days: 14

