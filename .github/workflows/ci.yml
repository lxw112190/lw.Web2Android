name: lw.Web2Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test and package all components
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install locked Android toolchain
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          sdkmanager "platforms;android-$($lock.platformApi)" "build-tools;$($lock.buildToolsVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up locked Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build and validate Runtime Bundle
        shell: pwsh
        run: |
          gradle --no-daemon --stacktrace -p runtime clean :app:lintRelease :app:assembleRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/package-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/ci-runtime | Out-Null
          Expand-Archive -LiteralPath build/runtime-dist/runtime-v1.zip -DestinationPath build/ci-runtime -Force

      - name: Build M0 proof APK
        shell: pwsh
        run: ./tools/m0-build.ps1

      - name: Build and test Windows Packer
        shell: pwsh
        run: |
          cmake -S packer -B build/packer -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/packer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/packer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed samples and verify identity isolation
        shell: pwsh
        run: |
          $packer = Resolve-Path 'build/packer/Release/lw.Web2Android.exe'
          $common = @('--android-sdk', $env:ANDROID_SDK_ROOT, '--runtime', 'build/ci-runtime', '--keys-dir', 'build/test-keys')

          & $packer build samples/hello/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helloCertificate = (Get-FileHash build/test-keys/com.lw.samples.hello/certificate.pem -Algorithm SHA256).Hash

          & $packer build samples/hello/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helloCertificateAgain = (Get-FileHash build/test-keys/com.lw.samples.hello/certificate.pem -Algorithm SHA256).Hash
          if ($helloCertificate -ne $helloCertificateAgain) {
            throw 'Same package did not reuse its signing identity'
          }

          & $packer build samples/remote/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteCertificate = (Get-FileHash build/test-keys/com.lw.samples.remote/certificate.pem -Algorithm SHA256).Hash
          if ($helloCertificate -eq $remoteCertificate) {
            throw 'Different packages unexpectedly share a certificate'
          }

      - name: Independently verify sample APKs
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          $zipalign = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($lock.buildToolsVersion)/zipalign.exe"
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($lock.buildToolsVersion)/lib/apksigner.jar"
          $expectations = @{
            'build/m3/hello-1.0.0-android.apk' = @('classes.dex', 'assets/lw-config.json', 'assets/www/index.html')
            'build/m3/remote-1.0.0-android.apk' = @('classes.dex', 'assets/lw-config.json')
          }

          foreach ($apk in $expectations.Keys) {
            & $zipalign -c -v 4 $apk
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & java -jar $apksigner verify --verbose --print-certs $apk
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
            try {
              $names = @($zip.Entries.FullName)
              foreach ($required in $expectations[$apk]) {
                if ($required -notin $names) { throw "$apk is missing $required" }
              }
              if ($apk -like '*remote*' -and $names.Where({ $_ -like 'assets/www/*' }).Count -ne 0) {
                throw "$apk unexpectedly contains local web assets"
              }
            } finally {
              $zip.Dispose()
            }

            $expectedHash = (Get-Content -Raw "$apk.sha256").Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
            $actualHash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) { throw "$apk SHA-256 sidecar does not match" }
          }

          if (Get-ChildItem build -Recurse -Filter '*.pk8' -File) {
            throw 'A temporary plaintext PKCS#8 key remained after signing'
          }

      - name: Assemble unified download package
        shell: pwsh
        run: |
          $package = 'build/ci-package/lw-Web2Android-m3'
          $directories = @(
            "$package/bin",
            "$package/runtime",
            "$package/samples/m0",
            "$package/samples/m3",
            "$package/docs"
          )
          New-Item -ItemType Directory -Force -Path $directories | Out-Null

          Copy-Item build/packer/Release/lw.Web2Android.exe "$package/bin/"
          Copy-Item build/runtime-dist/runtime-v1.zip "$package/runtime/"
          Copy-Item build/m0/out/sample-debug.apk,build/m0/out/sample-debug.apk.sha256 "$package/samples/m0/"
          Copy-Item build/m3/*-android.apk,build/m3/*-android.apk.sha256 "$package/samples/m3/"
          Copy-Item README.md "$package/docs/README.md"
          Copy-Item packer/README.md "$package/docs/PACKER.md"

          $root = (Resolve-Path $package).Path
          $checksums = Get-ChildItem -LiteralPath $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          Set-Content -LiteralPath "$package/SHA256SUMS.txt" -Value $checksums -Encoding utf8NoBOM

      - name: Upload unified CI package
        uses: actions/upload-artifact@v4
        with:
          name: lw-Web2Android-m3
          path: build/ci-package
          if-no-files-found: error
          retention-days: 14
