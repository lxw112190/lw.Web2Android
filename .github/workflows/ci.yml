name: lw.Web2Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_VERSION: '0.2.12'
  PACKAGE_NAME: lw-Web2Android-v0.2.12-windows-x64
  WECHAT_DEMO_REPOSITORY: lxw112190/wechat-article-formatter
  WECHAT_DEMO_REF: ad1afc5a2c31d7cb7dc458a69944d6cb7ee0cd88

jobs:
  build-test-package:
    name: Build, test and package all components
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate product version consistency
        shell: pwsh
        run: |
          $expectedPackage = "lw-Web2Android-v$env:PRODUCT_VERSION-windows-x64"
          if ($env:PACKAGE_NAME -ne $expectedPackage) {
            throw "PACKAGE_NAME $env:PACKAGE_NAME does not match $expectedPackage"
          }
          foreach ($cmakeFile in @('CMakeLists.txt', 'packer/CMakeLists.txt')) {
            $content = Get-Content -Raw -LiteralPath $cmakeFile
            $match = [regex]::Match($content, 'project\([^\r\n]*\bVERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
            if (-not $match.Success) {
              throw "Unable to read project version from $cmakeFile"
            }
            if ($match.Groups[1].Value -ne $env:PRODUCT_VERSION) {
              throw "$cmakeFile version $($match.Groups[1].Value) does not match PRODUCT_VERSION $env:PRODUCT_VERSION"
            }
          }
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          $runtimeGradle = Get-Content -Raw runtime/app/build.gradle
          foreach ($dependency in @(
              "androidx.core:core:$($lock.androidXCoreVersion)",
              "androidx.webkit:webkit:$($lock.androidXWebKitVersion)")) {
            if (-not $runtimeGradle.Contains($dependency)) {
              throw "Runtime dependency does not match toolchain.lock.json: $dependency"
            }
          }

      - name: Checkout real Web demo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.WECHAT_DEMO_REPOSITORY }}
          ref: ${{ env.WECHAT_DEMO_REF }}
          path: build/wechat-demo-source
          persist-credentials: false

      - name: Set up Node.js for the real Web demo
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build/wechat-demo-source/package-lock.json

      - name: Read locked toolchain versions
        id: toolchain
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          "platform_api=$($lock.platformApi)" >> $env:GITHUB_OUTPUT
          "build_tools=$($lock.buildToolsVersion)" >> $env:GITHUB_OUTPUT
          "command_line_tools=$($lock.commandLineToolsVersion)" >> $env:GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download locked redistributable Temurin JRE
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          $archive = 'build/temurin-jre.zip'
          New-Item -ItemType Directory -Force -Path build/ci-jre-extract | Out-Null
          curl.exe -L --fail --retry 3 --output $archive $lock.javaRuntimeUrl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $lock.javaRuntimeSha256) { throw 'Temurin JRE SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/ci-jre-extract
          $jre = Get-ChildItem build/ci-jre-extract -Directory | Select-Object -First 1
          if (-not $jre -or -not (Test-Path -LiteralPath "$($jre.FullName)/bin/java.exe")) {
            throw 'Temurin JRE archive has an unexpected layout'
          }
          Move-Item -LiteralPath $jre.FullName -Destination build/ci-jre

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ steps.toolchain.outputs.command_line_tools }}
          packages: ''

      - name: Restore locked Android Platform and Build Tools
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ steps.toolchain.outputs.platform_api }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ steps.toolchain.outputs.build_tools }}
          key: android-sdk-${{ runner.os }}-${{ steps.toolchain.outputs.platform_api }}-${{ steps.toolchain.outputs.build_tools }}

      - name: Install locked Android toolchain
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          sdkmanager "platforms;android-$($lock.platformApi)" "build-tools;$($lock.buildToolsVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up locked Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Restore pinned spdlog source archive
        uses: actions/cache@v4
        with:
          path: .deps/spdlog.tar.gz
          key: spdlog-${{ runner.os }}-1.17.0-d8862955

      - name: Download and verify pinned spdlog source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .deps | Out-Null
          $archive = '.deps/spdlog.tar.gz'
          if (-not (Test-Path -LiteralPath $archive)) {
            curl.exe -L --fail --retry 3 --output $archive `
              https://github.com/gabime/spdlog/archive/refs/tags/v1.17.0.tar.gz
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'd8862955c6d74e5846b3f580b1605d2428b11d97a410d86e2fb13e857cd3a744') {
            throw 'spdlog source SHA-256 mismatch'
          }
          tar.exe -xzf $archive -C .deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath '.deps/spdlog-1.17.0/include/spdlog/spdlog.h')) {
            throw 'Extracted spdlog source has an unexpected layout'
          }
          Move-Item -LiteralPath .deps/spdlog-1.17.0 -Destination .deps/spdlog-src

      - name: Build and validate Runtime Bundle
        shell: pwsh
        run: |
          gradle --no-daemon --stacktrace -p runtime clean :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/package-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/ci-runtime | Out-Null
          Expand-Archive -LiteralPath build/runtime-dist/runtime-v6.zip -DestinationPath build/ci-runtime -Force

      - name: Assemble and validate minimal end-user toolchain
        shell: pwsh
        run: |
          ./tools/assemble-minimal-toolchain.ps1 `
            -AndroidSdk $env:ANDROID_SDK_ROOT `
            -JavaHome build/ci-jre `
            -RuntimeDirectory build/ci-runtime `
            -Destination build/ci-minimal-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            'aapt2.exe', 'zipalign.exe', 'android.jar', 'apksigner/apksigner.jar',
            'jre/bin/java.exe', 'runtime/classes.dex', 'runtime/metadata.json', 'metadata.json'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path -LiteralPath "build/ci-minimal-toolchain/$relative")) {
              throw "Minimal toolchain is missing $relative"
            }
          }
          $runtimeMetadata = Get-Content -Raw build/ci-minimal-toolchain/runtime/metadata.json | ConvertFrom-Json
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          if ($runtimeMetadata.configSchemaVersion -ne $lock.runtimeConfigSchemaVersion) {
            throw 'Runtime config schema compatibility metadata is missing or invalid'
          }
          if ($runtimeMetadata.androidXCoreVersion -ne $lock.androidXCoreVersion -or
              $runtimeMetadata.androidXWebKitVersion -ne $lock.androidXWebKitVersion) {
            throw 'Runtime AndroidX dependency metadata is missing or invalid'
          }
          if (@($runtimeMetadata.dexFiles).Count -eq 0) {
            throw 'Runtime DEX integrity metadata is missing'
          }
          foreach ($dex in $runtimeMetadata.dexFiles) {
            $dexPath = Join-Path build/ci-minimal-toolchain/runtime $dex.name
            if (-not (Test-Path -LiteralPath $dexPath -PathType Leaf) -or
                (Get-Item -LiteralPath $dexPath).Length -ne $dex.size -or
                (Get-FileHash -LiteralPath $dexPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $dex.sha256) {
              throw "Runtime DEX integrity metadata does not match $($dex.name)"
            }
          }
          if ($runtimeMetadata.logging.maxFileSizeBytes -ne 2097152 -or
              $runtimeMetadata.logging.maxArchives -ne 5 -or
              $runtimeMetadata.logging.relativeExternalPath -ne 'logs/runtime.log' -or
              $runtimeMetadata.logging.runtimeTimestamp -ne 'device-local-with-utc-offset' -or
              -not $runtimeMetadata.logging.deviceInfoIncludesUtc -or
              -not $runtimeMetadata.logging.sensitiveValuesRedacted) {
            throw 'Runtime rotating-log metadata is missing or invalid'
          }
          if (-not $runtimeMetadata.capabilities.externalNavigationFailureIsNonFatal -or
              $runtimeMetadata.capabilities.fileChooser -ne 'system-content-uri-and-image-capture' -or
              -not $runtimeMetadata.capabilities.imageCapture.htmlCaptureAttribute -or
              -not $runtimeMetadata.capabilities.imageCapture.fullResolutionPrivateCache -or
              $runtimeMetadata.capabilities.imageCapture.cameraPermissionDeclared -or
              $runtimeMetadata.capabilities.imageCapture.staleCacheCleanupHours -ne 24 -or
              $runtimeMetadata.capabilities.downloadManager -ne 'http-https-app-external-files' -or
              -not $runtimeMetadata.capabilities.html5VideoFullscreen -or
              -not $runtimeMetadata.capabilities.legacyFixedWidthFitToWidth -or
              $runtimeMetadata.capabilities.html5FullscreenOrientationPolicy -ne 'preserve-landscape-otherwise-sensor' -or
              $runtimeMetadata.capabilities.nativeBridge) {
            throw 'Runtime Web compatibility metadata is missing or invalid'
          }
          $externalContent = $runtimeMetadata.capabilities.externalContent
          if ($externalContent.eventName -ne 'lw:external-content' -or
              $externalContent.queueName -ne '__lwExternalContentQueue' -or
              -not $externalContent.receiveSharedText -or
              -not $externalContent.openTextFiles -or
              $externalContent.multipleFiles -or
              $externalContent.writeBack -or
              $externalContent.nativeBridge -or
              $externalContent.remoteModeAllowed -or
              $externalContent.defaultMaxTextBytes -ne 8388608) {
            throw 'Runtime external-content metadata is missing or invalid'
          }

      - name: Build real Web demo
        id: demo
        shell: pwsh
        run: |
          Push-Location build/wechat-demo-source
          try {
            npm.cmd ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm.cmd run build -- --base=./
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          $index = Get-Content -Raw build/wechat-demo-source/dist/index.html
          if ($index -match '(?:src|href)="/[^/]') {
            throw 'The real Web demo contains root-relative assets; Android local packaging requires a relative Vite base.'
          }

          $demoPackage = Get-Content -Raw build/wechat-demo-source/package.json | ConvertFrom-Json
          $versionParts = @($demoPackage.version.Split('.') | ForEach-Object { [int]$_ })
          if ($versionParts.Count -ne 3) { throw "Unsupported demo version: $($demoPackage.version)" }
          $versionCode = $versionParts[0] * 10000 + $versionParts[1] * 100 + $versionParts[2]
          if ($versionCode -lt 1) { $versionCode = 1 }

          New-Item -ItemType Directory -Force -Path build/wechat-demo-project | Out-Null
          $project = [ordered]@{
            schemaVersion = 1
            mode = 'local'
            name = '微信文章发布工具'
            packageName = 'com.lw.samples.wechatformatter'
            versionName = [string]$demoPackage.version
            versionCode = $versionCode
            source = '../wechat-demo-source/dist'
            entry = 'index.html'
            fullscreen = $false
            orientation = 'auto'
            allowHttp = $false
            output = '../samples/wechat-article-formatter'
            outputFile = 'wechat-article-formatter-android.apk'
            runtime = '../ci-minimal-toolchain/runtime'
            toolchainLock = '../../toolchain.lock.json'
          }
          $project | ConvertTo-Json | Set-Content build/wechat-demo-project/project.json -Encoding utf8NoBOM

          $sourceCommit = (& git -C build/wechat-demo-source rev-parse HEAD).Trim()
          if ($sourceCommit -ne $env:WECHAT_DEMO_REF) {
            throw "Unexpected demo commit: $sourceCommit"
          }
          "version=$($demoPackage.version)" >> $env:GITHUB_OUTPUT
          "commit=$sourceCommit" >> $env:GITHUB_OUTPUT

      - name: Build and test Windows Packer
        shell: pwsh
        run: |
          cmake -S packer -B build/packer -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/packer --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/packer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/packer/Release/lw.Web2Android.GUI.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test native VS2022 solution
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1)
          if (-not $msbuild) { throw 'MSBuild for Visual Studio 2022 was not found' }

          & $msbuild lw.Web2Android.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & build/vs2022-native/x64/Release/lw_packer_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/vs2022-native/x64/Release/lw.Web2Android.GUI.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed demo and verify identity isolation
        shell: pwsh
        env:
          DEMO_SOURCE_COMMIT: ${{ steps.demo.outputs.commit }}
          DEMO_SOURCE_VERSION: ${{ steps.demo.outputs.version }}
        run: |
          $packer = Resolve-Path 'build/packer/Release/lw.Web2Android.exe'
          $common = @('--android-sdk', 'build/ci-minimal-toolchain', '--runtime', 'build/ci-minimal-toolchain/runtime', '--keys-dir', 'build/test-keys')

          & $packer build build/wechat-demo-project/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $demoCertificate = (Get-FileHash build/test-keys/com.lw.samples.wechatformatter/certificate.pem -Algorithm SHA256).Hash

          & $packer build build/wechat-demo-project/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $demoCertificateAgain = (Get-FileHash build/test-keys/com.lw.samples.wechatformatter/certificate.pem -Algorithm SHA256).Hash
          if ($demoCertificate -ne $demoCertificateAgain) {
            throw 'Same package did not reuse its signing identity'
          }

          & $packer build samples/remote/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $remoteCertificate = (Get-FileHash build/test-keys/com.lw.samples.remote/certificate.pem -Algorithm SHA256).Hash
          if ($demoCertificate -eq $remoteCertificate) {
            throw 'Different packages unexpectedly share a certificate'
          }

          & $packer build samples/unicode-assets/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $packer build samples/legacy-fixed-width/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $packer build samples/custom-icon/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $packer build samples/external-content-editor/project.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $packerLog = 'build/packer/Release/logs/packer.log'
          $logBytes = [System.IO.File]::ReadAllBytes($packerLog)
          if ($logBytes.Length -lt 3 -or $logBytes[0] -ne 0xEF -or
              $logBytes[1] -ne 0xBB -or $logBytes[2] -ne 0xBF) {
            throw 'Packer log is missing its UTF-8 BOM'
          }
          $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
          $packerLogText = $strictUtf8.GetString($logBytes, 3, $logBytes.Length - 3)
          if (-not $packerLogText.Contains('Application: 车辆检测系统')) {
            throw 'Packer log did not preserve the Chinese application name as UTF-8'
          }

          $identityInfo = & $packer signing info com.lw.samples.wechatformatter --keys-dir build/test-keys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identityInfoText = $identityInfo -join "`n"
          if ($identityInfoText -notmatch 'Certificate SHA-256: [0-9a-f]{64}') {
            throw 'Signing identity info did not report a certificate digest'
          }

          $demoSource = @"
          # Demo source

          - Repository: https://github.com/$env:WECHAT_DEMO_REPOSITORY
          - Commit: $env:DEMO_SOURCE_COMMIT
          - Version: $env:DEMO_SOURCE_VERSION
          - Build: ``npm ci`` then ``npm run build -- --base=./``
          "@
          $demoSource | Set-Content build/samples/wechat-article-formatter/SOURCE.md -Encoding utf8NoBOM
          Copy-Item build/wechat-demo-source/LICENSE build/samples/wechat-article-formatter/DEMO-LICENSE.txt

      - name: Independently verify sample APKs
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          $zipalign = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($lock.buildToolsVersion)/zipalign.exe"
          $aapt2 = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($lock.buildToolsVersion)/aapt2.exe"
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT "build-tools/$($lock.buildToolsVersion)/lib/apksigner.jar"
          $expectations = @(
            [pscustomobject]@{
              apk = 'build/samples/wechat-article-formatter/wechat-article-formatter-android.apk'
              required = @('classes.dex', 'assets/lw-config.json', 'assets/www/index.html')
              forbidden = @()
              expectHttp = $false
            },
            [pscustomobject]@{
              apk = 'build/samples/remote/lw-Web2Android-Remote-1.0.0-android.apk'
              required = @('classes.dex', 'assets/lw-config.json', 'res/xml/network_security_config.xml')
              forbidden = @('assets/www/index.html')
              expectHttp = $true
            },
            [pscustomobject]@{
              apk = 'build/samples/unicode-assets/unicode-assets-1.0.0-android.apk'
              required = @(
                'classes.dex',
                'assets/lw-config.json',
                'assets/www/index.html',
                'assets/www/测试页/index.html',
                'assets/www/文件/用户说明.txt',
                'assets/www/assets/中文图片.png'
              )
              forbidden = @('assets/www/project.json')
              expectHttp = $false
            },
            [pscustomobject]@{
              apk = 'build/samples/legacy-fixed-width/legacy-fixed-width-1.0.0-android.apk'
              required = @('classes.dex', 'assets/lw-config.json', 'assets/www/index.html')
              forbidden = @()
              expectHttp = $false
            },
            [pscustomobject]@{
              apk = 'build/samples/custom-icon/custom-icon-1.0.0-android.apk'
              required = @('classes.dex', 'assets/lw-config.json', 'assets/www/index.html')
              iconDensities = @('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi')
              forbidden = @('res/drawable/ic_launcher.xml')
              expectHttp = $false
            },
            [pscustomobject]@{
              apk = 'build/samples/external-content/external-content-editor-android.apk'
              required = @('classes.dex', 'assets/lw-config.json', 'assets/www/index.html')
              forbidden = @('assets/www/project.json')
              expectHttp = $false
              expectExternalContent = $true
            }
          )

          foreach ($expectation in $expectations) {
            $apk = $expectation.apk
            & $zipalign -c -v 4 $apk
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & java -jar $apksigner verify --verbose --print-certs $apk
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $manifestTree = (& $aapt2 dump xmltree --file AndroidManifest.xml $apk) -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($marker in @('com.lw.web2android.runtime.RuntimeFileProvider',
                                  'android.support.FILE_PROVIDER_PATHS')) {
              if (-not $manifestTree.Contains($marker)) {
                throw "$apk Manifest is missing camera capture marker: $marker"
              }
            }
            if ($manifestTree.Contains('android.permission.CAMERA')) {
              throw "$apk must not declare CAMERA permission for external camera capture"
            }

            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
            try {
              $names = @($zip.Entries.FullName)
              if ('res/xml/lw_camera_file_paths.xml' -notin $names) {
                throw "$apk is missing the private camera FileProvider paths resource"
              }
              foreach ($required in $expectation.required) {
                if ($required -notin $names) { throw "$apk is missing $required" }
              }
              $iconDensities = $expectation.PSObject.Properties['iconDensities']
              if ($null -ne $iconDensities) {
                foreach ($density in $iconDensities.Value) {
                  # AAPT2 canonicalizes density resources to directories such as
                  # mipmap-mdpi-v4; accept its version qualifier but still require
                  # exactly one launcher PNG for every generated density.
                  $pattern = "^res/mipmap-$density(?:-v[0-9]+)?/ic_launcher[.]png$"
                  $iconEntries = @($names | Where-Object { $_ -match $pattern })
                  if ($iconEntries.Count -ne 1) {
                    throw "$apk must contain exactly one $density launcher icon; found: $($iconEntries -join ', ')"
                  }
                }
              }
              foreach ($forbidden in $expectation.forbidden) {
                if ($forbidden -in $names) { throw "$apk unexpectedly contains $forbidden" }
              }
              $nonCanonical = @($names | Where-Object { $_.Contains('\') })
              if ($nonCanonical.Count -ne 0) {
                throw "$apk contains non-canonical backslash ZIP entries: $($nonCanonical -join ', ')"
              }
              $duplicates = @($names | Group-Object | Where-Object Count -gt 1)
              if ($duplicates.Count -ne 0) {
                throw "$apk contains duplicate ZIP entries: $(($duplicates.Name) -join ', ')"
              }
              $configEntry = $zip.GetEntry('assets/lw-config.json')
              $reader = [System.IO.StreamReader]::new($configEntry.Open())
              try {
                $runtimeConfig = $reader.ReadToEnd() | ConvertFrom-Json
              } finally {
                $reader.Dispose()
              }
              if ($runtimeConfig.schemaVersion -ne 2) {
                throw "$apk uses unexpected Runtime config schemaVersion $($runtimeConfig.schemaVersion)"
              }
              $expectExternal = $expectation.PSObject.Properties['expectExternalContent']
              if ($null -ne $expectExternal -and $expectExternal.Value) {
                if (-not $runtimeConfig.externalContent.enabled -or
                    -not $runtimeConfig.externalContent.receiveSharedText -or
                    -not $runtimeConfig.externalContent.openFiles -or
                    $runtimeConfig.externalContent.maxTextBytes -ne 8388608 -or
                    'yaml' -notin $runtimeConfig.externalContent.extensions -or
                    'application/yaml' -notin $runtimeConfig.externalContent.mimeTypes) {
                  throw "$apk external-content Runtime config is incomplete"
                }
                foreach ($marker in @('android.intent.action.VIEW', 'android.intent.action.SEND',
                                      'android.intent.category.DEFAULT', 'text/*', 'application/json',
                                      'application/yaml', 'application/toml')) {
                  if (-not $manifestTree.Contains($marker)) {
                    throw "$apk Manifest is missing external-content marker: $marker"
                  }
                }
              }
              if ($expectation.expectHttp -and -not $runtimeConfig.allowHttp) {
                throw "$apk did not preserve the trusted-intranet HTTP setting"
              }
              if ($runtimeConfig.mode -eq 'local') {
                $packagedEntry = "assets/$($runtimeConfig.entry)"
                if ($packagedEntry -notin $names) {
                  throw "$apk Runtime entry does not exist in the APK: $packagedEntry"
                }
                $htmlEntry = $zip.GetEntry($packagedEntry)
                $htmlReader = [System.IO.StreamReader]::new($htmlEntry.Open())
                try {
                  $html = $htmlReader.ReadToEnd()
                } finally {
                  $htmlReader.Dispose()
                }
                if ($html -match '(?:src|href)="/[^/]') {
                  throw "$apk contains root-relative Web assets"
                }
              } elseif ($names.Where({ $_ -like 'assets/www/*' }).Count -ne 0) {
                throw "$apk unexpectedly contains local web assets"
              }
            } finally {
              $zip.Dispose()
            }

            $expectedHash = (Get-Content -Raw "$apk.sha256").Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
            $actualHash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expectedHash -ne $actualHash) { throw "$apk SHA-256 sidecar does not match" }

            $releaseDirectory = [System.IO.Path]::GetDirectoryName($apk)
            $releaseFileStem = [System.IO.Path]::GetFileNameWithoutExtension($apk)
            $releaseStem = Join-Path $releaseDirectory $releaseFileStem
            $releaseJsonPath = "$releaseStem.release.json"
            $releaseMarkdownPath = "$releaseStem-RELEASE.md"
            if (-not (Test-Path -LiteralPath $releaseJsonPath)) {
              throw "$apk is missing release metadata: $releaseJsonPath"
            }
            if (-not (Test-Path -LiteralPath $releaseMarkdownPath)) {
              throw "$apk is missing release metadata: $releaseMarkdownPath"
            }
            $release = Get-Content -Raw -LiteralPath $releaseJsonPath | ConvertFrom-Json
            if ($release.apkSha256 -ne $actualHash -or $release.certificateSha256 -notmatch '^[0-9a-f]{64}$') {
              throw "$apk contains invalid release identity metadata"
            }
            if ($release.runtimeVersion -ne $lock.runtimeVersion -or $release.toolchainVersion -ne $lock.toolchainVersion) {
              throw "$apk release metadata does not match toolchain.lock.json"
            }
          }

          if (Get-ChildItem build -Recurse -Filter '*.pk8' -File) {
            throw 'A temporary plaintext PKCS#8 key remained after signing'
          }

      - name: Assemble unified download package
        shell: pwsh
        run: |
          $package = "build/ci-package/$env:PACKAGE_NAME"
          $directories = @(
            "$package/bin",
            "$package/toolchain/runtime",
            "$package/toolchain/jre",
            "$package/assets",
            "$package/tools",
            "$package/samples/wechat-article-formatter",
            "$package/docs/assets",
            "$package/third_party/licenses"
          )
          New-Item -ItemType Directory -Force -Path $directories | Out-Null

          Copy-Item build/packer/Release/lw.Web2Android.exe "$package/bin/"
          Copy-Item build/packer/Release/lw.Web2Android.GUI.exe "$package/bin/"
          Copy-Item build/runtime-dist/runtime-v6.zip "$package/toolchain/"
          Copy-Item build/ci-runtime/* "$package/toolchain/runtime/" -Recurse
          Copy-Item build/ci-jre/* "$package/toolchain/jre/" -Recurse
          Copy-Item toolchain.lock.json "$package/"
          Copy-Item build/samples/wechat-article-formatter/* "$package/samples/wechat-article-formatter/"
          Copy-Item tools/install-minimal-toolchain.ps1,tools/assemble-minimal-toolchain.ps1 "$package/tools/"
          Copy-Item README.md "$package/docs/README.md"
          Copy-Item README_EN.md "$package/docs/README_EN.md"
          Copy-Item packer/README.md "$package/docs/PACKER.md"
          Copy-Item assets/sponsor.jpg "$package/docs/assets/"
          Copy-Item assets/default-app-icon.png "$package/assets/"
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.md "$package/"
          Copy-Item third_party/licenses/spdlog-LICENSE.txt "$package/third_party/licenses/"
          ./tools/write-distribution-metadata.ps1 -PackageDirectory $package -Version $env:PRODUCT_VERSION -Commit $env:GITHUB_SHA

          $root = (Resolve-Path $package).Path
          $checksums = Get-ChildItem -LiteralPath $root -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          Set-Content -LiteralPath "$package/SHA256SUMS.txt" -Value $checksums -Encoding utf8NoBOM

      - name: Upload unified CI package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: build/ci-package
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Download verified package
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: build/release-download

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$env:PRODUCT_VERSION") {
            throw "Tag $env:GITHUB_REF_NAME does not match product version v$env:PRODUCT_VERSION"
          }
          $source = "build/release-download/$env:PACKAGE_NAME"
          if (-not (Test-Path -LiteralPath "$source/RELEASE.md")) { throw 'Verified release package was not found' }
          $archive = "build/$env:PACKAGE_NAME.zip"
          Compress-Archive -LiteralPath $source -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE_NAME.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "build/$env:PACKAGE_NAME.zip" `
            "build/$env:PACKAGE_NAME.zip.sha256" `
            --verify-tag `
            --title "lw.Web2Android $env:GITHUB_REF_NAME" `
            --notes-file "build/release-download/$env:PACKAGE_NAME/RELEASE.md"
