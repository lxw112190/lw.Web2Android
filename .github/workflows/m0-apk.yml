name: M0 APK Proof of Concept

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-m0-apk:
    name: Build, align, sign and verify APK
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''

      - name: Install locked Android toolchain
        shell: pwsh
        run: |
          $lock = Get-Content -Raw toolchain.lock.json | ConvertFrom-Json
          sdkmanager "platforms;android-$($lock.platformApi)" "build-tools;$($lock.buildToolsVersion)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run M0 assembly pipeline
        shell: pwsh
        run: ./tools/m0-build.ps1

      - name: Upload installable sample APK
        uses: actions/upload-artifact@v4
        with:
          name: m0-sample-debug-apk
          path: |
            build/m0/out/sample-debug.apk
            build/m0/out/sample-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
